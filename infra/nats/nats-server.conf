# NATS server configuration for LOCAL DEVELOPMENT ONLY (compose.yaml).
#
# The passwords below are public, dev-only values. Production uses its own operator/account setup
# (decentralized JWT auth with .creds files) and never these users or passwords; see
# docs/public-inquiry-submission.md, "NATS permissions".

server_name: fionas-local
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 1MB

jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 1GB
}

accounts {
  FIONAS {
    jetstream: enabled
    users: [
      # Operators, the setup/tail scripts and the e2e assertions: full rights in this account.
      { user: fionas-admin, password: fionas-admin-dev }

      # apps/public: least privilege. It may publish exactly one subject, and subscribe only to
      # its own inboxes, where JetStream answers with the PubAck. It cannot read, create or
      # change streams.
      {
        user: fionas-web
        password: fionas-web-dev
        permissions: {
          publish: { allow: ["fionas.inquiries.submitted.v1"] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
}

